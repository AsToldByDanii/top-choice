<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101010" />
  <meta name="description" content="Top Choice Inc. — Something exceptional is coming soon." />
  <title>Top Choice Inc. | Coming Soon</title>
  <link rel="icon" type="image/png" href="assets/top-choice-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{color-scheme:dark;--ink:#f5f3ee;--muted:#aaa8a5;--gold:#c4a77d}
    *{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;background:#101010;color:var(--ink);font-family:'DM Sans',Arial,sans-serif;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,#292622 0%,#161514 36%,#101010 72%)}
    .frame{position:relative;min-height:100vh;display:flex;flex-direction:column;padding:30px clamp(24px,6vw,100px)}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-family:Montserrat,sans-serif;letter-spacing:.25em;font-size:11px;font-weight:600;text-transform:uppercase}.status{display:flex;align-items:center;gap:10px;color:#c6c0b6;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.dot{height:7px;width:7px;background:var(--gold);border-radius:50%;box-shadow:0 0 14px #c4a77d99}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:65px 0 75px}.logo-card{background:#fff;border-radius:12px;padding:18px 26px;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 60px #0005;max-width:min(430px,86vw)}.logo-card img{display:block;width:100%;height:auto;image-rendering:auto}.eyebrow{font-size:11px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin:55px 0 20px}h1{font-family:Montserrat,Arial,sans-serif;font-size:clamp(48px,10vw,118px);font-weight:300;line-height:1;letter-spacing:.085em;margin:0;text-transform:uppercase}h1 span{display:block}.sub{font-size:clamp(14px,1.6vw,17px);line-height:1.85;color:var(--muted);max-width:450px;margin:30px auto 0}.rule{height:1px;width:75px;background:var(--gold);margin:36px auto 0;opacity:.8}
    footer{border-top:1px solid #ffffff1c;display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:22px;color:#8d8a86;font-size:11px;letter-spacing:.1em}footer span:last-child{text-transform:uppercase;letter-spacing:.19em}
    .reveal{animation:rise 1.1s ease both}.delay{animation-delay:.2s}.delay2{animation-delay:.4s}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){.frame{padding:23px 22px}header .brand{font-size:9px;letter-spacing:.13em}.status{font-size:9px;letter-spacing:.08em}main{padding:75px 0}.logo-card{padding:12px 18px}.eyebrow{margin-top:45px}h1{font-size:clamp(43px,11vw,72px);letter-spacing:.035em}.sub{margin-top:23px}footer{flex-direction:column;text-align:center;gap:9px}}
    @media(prefers-reduced-motion:reduce){.reveal{animation:none}}
  </style>
</head>
<body>
  <div class="frame">
    <header><div class="brand">Top Choice Inc.</div><div class="status"><span class="dot" aria-hidden="true"></span> Website in progress</div></header>
    <main>
      <div class="logo-card reveal"><img src="assets/top-choice-logo.png" alt="Top Choice Inc. logo" /></div>
      <p class="eyebrow reveal delay">A new experience awaits</p>
      <h1 class="reveal delay"><span>Coming</span><span>Soon</span></h1>
      <div class="rule reveal delay2"></div>
      <p class="sub reveal delay2">Something exceptional is taking shape.<br />We're creating an experience worth waiting for.</p>
    </main>
    <footer><span>© <span id="year">2026</span> Top Choice Inc. All rights reserved.</span><span>Stay tuned</span></footer>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
